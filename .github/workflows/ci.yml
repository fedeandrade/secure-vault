name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault_ci
          POSTGRES_PASSWORD: vault_ci
          POSTGRES_DB: vault_test
        ports:
          # 5433 no host: o ubuntu-latest ja traz um PostgreSQL ocupando a
          # 5432, e a colisao mandava a conexao para o servidor errado — que
          # nao tem o usuario vault_ci. O sintoma era
          # "password authentication failed", que parece senha errada e nao e.
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://vault_ci:vault_ci@localhost:5433/vault_test
      TEST_DATABASE_URL: postgresql+psycopg://vault_ci:vault_ci@localhost:5433/vault_test
      KDF_ALGORITHM: argon2id

    steps:
      - uses: actions/checkout@v4

      - name: Instala o uv
        run: |
          set -o pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Adiciona o uv ao PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirma que o uv foi instalado
        run: uv --version

      - name: Instala as dependências
        run: uv sync --locked

      - name: Aplica as migrations
        run: uv run alembic upgrade head

      # O lint entra ANTES dos testes e com o mesmo comando do gate local
      # (.claude/gate.json): `ruff check . && pytest`. Sem isto, o CI aprovava
      # o que a trava local reprovava, e a divergência só aparecia no merge.
      - name: Confere o lint
        run: uv run ruff check .

      - name: Roda a suite de testes
        run: uv run pytest tests/ -v

  # Job separado do Python de propósito: o site tem toolchain própria (Node) e
  # banco próprio (decisão de 22/09/2026). Rodar junto faria uma falha de lint
  # do TypeScript esconder o resultado da suíte Python, e vice-versa.
  #
  # Não há `DATABASE_URL` aqui, e isso é a prova de uma decisão: `prisma
  # generate` roda sem conexão. Se alguém trocar o `process.env["DATABASE_URL"]`
  # do `prisma.config.ts` por `env("DATABASE_URL")`, este job fica vermelho —
  # que é exatamente o aviso que se quer.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Gera o cliente do Prisma
        run: npx prisma generate

      # O Next 16 GERA `LayoutProps`/`PageProps` em `.next/types/`, e o
      # `layout.tsx` os usa. Sem este passo o tsc falha com TS2304 em clone
      # limpo — que foi exatamente o que aconteceu aqui enquanto o gate local
      # passava por causa de um `.next/` sobrando.
      - name: Gera os tipos de rota do Next
        run: npx next typegen

      - name: Confere os tipos
        run: npx tsc --noEmit

      - name: Confere o lint
        run: npx eslint

      - name: Roda os testes do site
        run: npx vitest run

      - name: Compila o site
        run: npx next build
